name: Due-date reminders
on:
  schedule:
    - cron: '0 0 * * *'   # every day at 8:00 AM Manila (00:00 UTC)
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every phone with reminders on'
        type: boolean
        default: false
jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: https://vfgaopmunjrdjjtsdvrs.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: BEvr3DocmrVbShbp0btUZkDBc2dzFACoL2ZHnwo9xDjX60aIAr3HUZFmi5OoDhTzeGojm1SXy2TfvbgQzJjeDWM
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ inputs.test }}
