// ---- split + balance math (all integer centavos) ----
// Andy always takes the rounded half, Geri the remainder, so the two shares always add up to the exact total.
function shareOf(a,u){return u==='Andy'?Math.round(a/2):a-Math.round(a/2)}
function share(r,u){if(r.scope!=='shared'||r.kind!=='expense')return r.owner===u?r.amount:0;return shareOf(r.amount,u)}
// Bills recur monthly: only payments dated in the billing month count toward that month's balance.
function cyc(r,m){return r.kind==='bill'?(m||today().slice(0,7)):null}
function paymentsFor(r,m){let c=cyc(r,m);return active().filter(p=>p.kind==='payment'&&p.parentId===r.id&&(!c||(p.date||'').slice(0,7)===c))}
function totalDue(r){return r.kind==='installment'?r.amount*r.totalMonths:r.amount}
function prepaid(r){return r.kind==='installment'?(Number(r.paidMonths)||0)*r.amount:0}
function totalPaid(r,m){return prepaid(r)+paymentsFor(r,m).reduce((s,p)=>s+p.amount,0)}
function paidByUser(r,u,m){return paymentsFor(r,m).filter(p=>p.paidBy===u).reduce((s,p)=>s+p.amount,0)}
// Loans with Months left + a monthly repayment: balance = months left x monthly share, minus payments recorded since.
function monthlyOf(r){return r.kind==='installment'?Number(r.amount)||0:Number(r.monthlyPayment)||0}
function paidSinceSet(r,u){let since=r.loanMonthsSetISO||'';return paymentsFor(r).filter(p=>(r.owner!=='Shared'||p.paidBy===u)&&(p.createdAtISO||'')>=since).reduce((z,p)=>z+p.amount,0)}
function loanManual(r){return (r.kind==='loan'||r.kind==='installment')&&r.loanMonthsLeft!==null&&r.loanMonthsLeft!==undefined&&r.loanMonthsLeft!==''&&monthlyOf(r)>0}
function loanManualLeft(r,u){let mp=monthlyOf(r),per=r.owner==='Shared'?shareOf(mp,u):mp;return Math.max(0,Number(r.loanMonthsLeft)*per-paidSinceSet(r,u))}
function remaining(r,m){if(loanManual(r))return r.owner==='Shared'?loanManualLeft(r,'Andy')+loanManualLeft(r,'Geri'):loanManualLeft(r,r.owner);return Math.max(0,totalDue(r)-totalPaid(r,m))}
function personalRemaining(r,u,m){if(loanManual(r))return r.owner==='Shared'?loanManualLeft(r,u):remaining(r,m);return r.owner==='Shared'?Math.max(0,shareOf(totalDue(r),u)-shareOf(prepaid(r),u)-paidByUser(r,u,m)):remaining(r,m)}
// Loans: months left. If Months left was entered by hand, start from that number and subtract one
// for every full monthly repayment recorded after it was set. Otherwise: remaining ÷ monthly repayment.
function loanPer(r,u){let mp=monthlyOf(r);return r.owner==='Shared'?shareOf(mp,u):mp}

// Payday cutoff (15th or 30th). Records saved before this setting fall back to their due day.

function cutExpenses(u,cut){let m=today().slice(0,7);return active().filter(r=>r.kind==='expense'&&!r.cashOnHand&&r.deductFrom!=='cash'&&(r.date||'').slice(0,7)===m&&share(r,u)>0&&cutoffOf(r)===cut).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
