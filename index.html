 let paidPeriod=0;
 if(loanManual(r)){if(personalRemaining(r,u)===0)return {label:'Fully Paid',cls:'paid'};let per=loanPer(r,u),sd=r.loanMonthsSetISO?new Date(r.loanMonthsSetISO):new Date(),start=sd.getFullYear()*12+sd.getMonth();if(sd.getDate()>Number(r.dueDay))start++;let t=start+(per>0?Math.floor(paidSinceSet(r,u)/per):0);due=cycleDate(Math.floor(t/12),t%12,r.dueDay)}else if(r.kind==='installment'){let pays=paymentsFor(r).filter(p=>p.paidBy===u).sort((a,b)=>(a.date||'').localeCompare(b.date||''));let prepaidU=r.owner==='Shared'?shareOf(prepaid(r),u):prepaid(r);let totalU=prepaidU+pays.reduce((z,p)=>z+p.amount,0);let paidMonths=dueAmt>0?Math.floor(totalU/dueAmt):0;let dueMonthIndex=Number(r.dueAnchor||0);if(!dueMonthIndex){let date=new Date((r.date||today())+'T12:00:00');dueMonthIndex=date.getFullYear()*12+date.getMonth()}let targetIndex=dueMonthIndex+paidMonths;let thisIndex=now.getFullYear()*12+now.getMonth();if(personalRemaining(r,u)===0)return {label:'Fully Paid',cls:'paid'};if(targetIndex>thisIndex){due=cycleDate(Math.floor(targetIndex/12),targetIndex%12,r.dueDay)}else if(targetIndex<thisIndex){due=cycleDate(Math.floor(targetIndex/12),targetIndex%12,r.dueDay)}else due=base;
 }else if(r.kind==='bill'){if(personalRemaining(r,u,month)===0)return {label:'Fully Paid this month',cls:'paid'};}else if(personalRemaining(r,u)===0)return {label:'Fully Paid',cls:'paid'};
